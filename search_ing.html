<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Results</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="newcss.css">
</head>
<body class="flex flex-column">
    
  <header class="nav">
    <nav class="nav-menu">
        <div class="logo-container">
            <a class="logo" href="cleaned_main.html" > <img src="../images/logo_tasty.png" alt="Tasty Logo" height="10%" width="10%"></a>
        </div>
        
        <ul class="nav__primary-menu list-unstyled">
            <li class="nav__primary-menu-item list-unstyled">
                <button class="nav__primary-menu-button button--clear" onclick="toggleSubmenu()" value="">
                    <span class="nav__primary-menu-button-text">Recipes</span>
                </button>

                <button class="nav__primary-menu-button button--clear" value="">
                    <a class="nav__submenu-item" href="own_recipe.html">Your own recipes</a>
                </button>

                <div id="recipes-submenu" class="nav__desktop-submenu">
                    <div class="nav__desktop-submenu-content">
                        <div class="nav__submenu-close-button--wrapper xs-flex-order-2">
                            <button aria-label="Close submenu" class="nav__submenu-close-button" onclick="toggleSubmenu()">
                                <span class="screenreader-only">Close</span>
                            </button>
                        </div>
                        <h2 id="recipes-heading" class="screenreader-only">Recipes Submenu</h2>
                        <section class="nav__submenu-category-wrapper">
                            <div class="submenu-column">
                                <h4 class="nav__submenu-category-heading">Popular</h4>
                                <ul class="nav__submenu-category">
                                    <li class="list-unstyled">
                                        <a class="nav__submenu-item" href="easy_dinners.html">Easy Dinners</a>
                                    </li>
                                </ul>
                            </div>
                            <div class="submenu-column">
                                <h4 class="nav__submenu-category-heading">Do you want to Submit Your Recipe?</h4>
                                <ul class="nav__submenu-category">
                                    <li class="list-unstyled">
                                        <a class="nav__submenu-item" href="submit_recipe.html">Submit</a>
                                    </li>
                                </ul>
                            </div>
                        </section>
                    </div>
                </div>
            </li>
        </ul>
        
        <div class="menu-search">
            <form class="search-form" id="search-form">
                <label for="search-input" class="screenreader-only">Search for recipes</label>
                <input type="text" id="search-input" class="search-input" placeholder="Search Tasty">
                <button class="clear-search" type="button"></button>
            </form>
        </div>
    </nav>
  </header>

  <h1>Recipes for <span id="ingredient-name"></span></h1>
  <div id="recipe-list"></div>

  <div id="chartContainer" class="hidden">
    <h2>Nutritional Information</h2>
    <canvas id="nutritionChart"></canvas>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const searchForm = document.getElementById('search-form');
      const searchInput = document.getElementById('search-input');

      searchForm.addEventListener('submit', function(event) {
        event.preventDefault(); 
        const searchQuery = searchInput.value.trim();

        if (searchQuery) {
          window.location.href = `search_ing.html?ingredient=${encodeURIComponent(searchQuery)}`;
        } else {
          alert('Please enter an ingredient!');
        }
      });

      const urlParams = new URLSearchParams(window.location.search);
      const ingredient = urlParams.get('ingredient');

      document.getElementById('ingredient-name').textContent = ingredient;

      if (ingredient) {
        fetchRecipes(ingredient);
      }

      async function fetchRecipes(ingredient) {
        try {
          const response = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?i=${ingredient}`);
          if (!response.ok) throw new Error('No recipes found');
          const data = await response.json();

          const recipes = data.meals || [];
          displayRecipes(recipes);
          displayNutritionChart();
        } catch (error) {
          const recipeList = document.getElementById('recipe-list');
          const errorMessage = document.createElement('p');
          errorMessage.textContent = `Error: ${error.message}`;
          recipeList.appendChild(errorMessage);
        }
      }

      function displayRecipes(recipes) {
        const recipeList = document.getElementById('recipe-list');
        recipeList.innerHTML = '';
        if (recipes.length > 0) {
          recipes.forEach(recipe => {
            const recipeDiv = document.createElement('div');
            const recipeName = document.createElement('h3');
            recipeName.textContent = recipe.strMeal;
            const recipeImage = document.createElement('img');
            recipeImage.src = recipe.strMealThumb;
            recipeImage.alt = recipe.strMeal;
            recipeImage.width = 150;
            recipeDiv.appendChild(recipeName);
            recipeDiv.appendChild(recipeImage);
            recipeList.appendChild(recipeDiv);
          });
        } else {
          const noRecipesMessage = document.createElement('p');
          noRecipesMessage.textContent = 'No recipes found for this ingredient.';
          recipeList.appendChild(noRecipesMessage);
        }
      }

      function displayNutritionChart() {
        const chartContainer = document.getElementById('chartContainer');
        chartContainer.classList.remove('hidden');
        const ctx = document.getElementById('nutritionChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Protein', 'Carbs', 'Fat', 'Fiber'],
            datasets: [{
              label: 'Nutritional Value (g)',
              data: [Math.random() * 50, Math.random() * 60, Math.random() * 20, Math.random() * 10],
              backgroundColor: ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db'],
              borderColor: ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db'],
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      }
    });
  </script>
</body>
</html>
